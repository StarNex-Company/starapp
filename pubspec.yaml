name: starapp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  device_preview_plus: ^2.7.2
  dio: ^5.9.0
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.2
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^2.0.1
  intl: ^0.20.2
  flutter_svg: ^2.3.2
  cached_network_image: ^4.0.3
  url_launcher: ^6.3.3
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^4.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/home/
    - assets/vectors/
    - assets/vectors/home/
    - assets/vectors/shared/
    - assets/images/create/
    - assets/vectors/create/
    - assets/images/moderation/
    - assets/vectors/moderation/
    - assets/images/challenges/
    - assets/vectors/challenges/
    - assets/images/discover/
    - assets/vectors/discover/
    - assets/images/search/
    - assets/vectors/search/
    - assets/images/notifications/
    - assets/vectors/notifications/
    - assets/images/videos/
    - assets/vectors/videos/
    - assets/images/stories/
    - assets/vectors/stories/
    - assets/images/profile/
    - assets/vectors/profile/
    - assets/images/settings/
    - assets/vectors/settings/
    - assets/images/verification/
    - assets/vectors/verification/
    - assets/images/messages/
    - assets/vectors/messages/
    - assets/images/scout/
    - assets/vectors/scout/
    - assets/images/wallet/
    - assets/vectors/wallet/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
